name: application_v2
description: "Candling capture, tray readiness, dataset, and research history app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  http: ^1.2.0
  network_info_plus: ^6.1.3
  permission_handler: ^11.3.1
  mjpeg_view: ^1.0.1
  # Print / Share / Backup
  pdf: ^3.10.8
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  archive: ^4.0.9
  # Image compression
  image: ^4.0.17
  image_picker: ^1.2.3
  tflite_flutter: ^0.12.1
  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
